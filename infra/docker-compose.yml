# Runs the worker. Same file on your Mac, the Oracle VM or any VPS.
#   1. cp infra/.env.example infra/.env   and fill in WORKER_DATABASE_URL
#   2. docker compose -f infra/docker-compose.yml up --build -d
#   3. docker compose -f infra/docker-compose.yml logs -f worker
services:
  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    env_file: .env
    restart: unless-stopped        # comes back after a crash or a reboot
    # Hardening: no ports published, read-only filesystem, no extra privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 64
    stop_grace_period: 40s
