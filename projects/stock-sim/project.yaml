# yaml-language-server: $schema=../project.schema.json
schema: 1
name: Stock Allocation Simulator
type: runner
status: building
featured: true
order: 10
tags: [python, data]
accent: teal
summary:
  en: Give it an amount, a risk level and a time span. It picks US stocks and ETFs with simple rules, weights them, and shows how that portfolio would have done against the S&P 500.
  de: Betrag, Risikostufe und Zeitraum eingeben. Der Simulator wählt US-Aktien und ETFs nach einfachen Regeln, gewichtet sie und zeigt, wie das Portfolio gegenüber dem S&P 500 abgeschnitten hätte.
repo: https://github.com/yashcontractor04/stock-simulator
stack: [Python, FastAPI, Postgres, pandas, Docker]
# Shows the "Dashboard" tab with the three live model portfolios (daily snapshot).
dashboard: sim-snapshot

# The simulator is its own backend in its own repo. The runner in this repo
# (worker/worker/runners/stock_sim.py) is only an adapter that forwards the job.
# These inputs mirror SimulationParams in the simulator's docs/openapi.yaml.
runner:
  timeout_seconds: 120
  max_attempts: 2
  disclaimer: not-financial-advice
  inputs:
    - name: capital
      type: number
      label: { en: "Capital (USD)", de: "Kapital (USD)" }
      min: 100
      max: 10000000
      default: 10000
    - name: risk_level
      type: select
      label: { en: Risk level, de: Risikostufe }
      default: medium
      options:
        - { value: low, label: { en: Low, de: Niedrig } }
        - { value: medium, label: { en: Medium, de: Mittel } }
        - { value: high, label: { en: High, de: Hoch } }
    - name: time_span_years
      type: integer
      label: { en: "Time span (years)", de: "Zeitraum (Jahre)" }
      help: { en: "How far the backtest looks back, 1 to 20 years", de: "Wie weit der Backtest zurückschaut, 1 bis 20 Jahre" }
      min: 1
      max: 20
      default: 10
    - name: industries
      type: string_list
      label: { en: Industries, de: Branchen }
      help: { en: "Optional, up to 5, e.g. healthcare, technology, defense", de: "Optional, bis zu 5, z. B. healthcare, technology, defense" }
      required: false
      min_items: 0
      max_items: 5
      max_length: 40
      pattern: "^[a-z0-9-]{1,40}$"
      default: []
    - name: themes
      type: string_list
      label: { en: Themes, de: Themen }
      help: { en: "Optional, up to 3, e.g. ai", de: "Optional, bis zu 3, z. B. ai" }
      required: false
      min_items: 0
      max_items: 3
      max_length: 40
      pattern: "^[a-z0-9-]{1,40}$"
      default: []
  demo:
    params:
      capital: 10000
      risk_level: medium
      time_span_years: 10
      industries: [healthcare, technology]
      themes: []
