[project]
name = "portfolio-worker"
version = "0.1.0"
description = "Polls the Postgres job queue and runs project runners."
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311"]  # asserts are fine in tests; random is used for simulation, not security

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*"]
