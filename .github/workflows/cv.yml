name: Build CV PDFs

# Updating the CV = edit content/cv.yaml and push. This workflow rebuilds both
# PDFs and commits them to web/public/cv/, which triggers a new Vercel deploy.
on:
  push:
    branches: [main]
    paths:
      - content/cv.yaml
      - content/cv/**
  workflow_dispatch:

# This is the only workflow allowed to write to the repo.
permissions:
  contents: write

concurrency:
  group: cv
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
      - name: Compile EN + DE
        run: |
          mkdir -p web/public/cv
          typst compile --root . --input lang=en content/cv/cv.typ web/public/cv/cv-en.pdf
          typst compile --root . --input lang=de content/cv/cv.typ web/public/cv/cv-de.pdf
      - name: Commit PDFs if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/cv
          git diff --cached --quiet || (git commit -m "Rebuild CV PDFs from cv.yaml" && git push)
