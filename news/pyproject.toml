[project]
name = "portfolio-news"
version = "0.1.0"
description = "Fetches news feeds into the shared article pool and builds per-user feeds."
requires-python = ">=3.12"
dependencies = [
  "feedparser>=6.0.11,<7",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["news*"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # XML fixtures are easier to read on one line
